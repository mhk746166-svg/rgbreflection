<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>디스플레이 화소(Pixel) 가산혼합 시뮬레이션</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] },
                    colors: {
                        darkBg: '#0f172a',
                        glassBg: 'rgba(30, 41, 59, 0.75)',
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .btn-press {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-press:active {
            transform: scale(0.95);
        }
        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            border-radius: 4px;
        }
        .range-r::-webkit-slider-runnable-track { background: linear-gradient(to right, #4a0000, #ff0000); }
        .range-g::-webkit-slider-runnable-track { background: linear-gradient(to right, #004a00, #00ff00); }
        .range-b::-webkit-slider-runnable-track { background: linear-gradient(to right, #00004a, #0000ff); }
        .range-zoom::-webkit-slider-runnable-track { background: linear-gradient(to right, #334155, #cbd5e1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // =========================================================================
        // ⚠️ 선생님 구글 시트 웹앱 URL을 아래 따옴표 안에 넣어주세요!
        // =========================================================================
        const GOOGLE_SCRIPT_URL = ""; 

        const App = () => {
            // RGB 및 Zoom 상태
            const [r, setR] = useState(0);
            const [g, setG] = useState(0);
            const [b, setB] = useState(0);
            const [zoom, setZoom] = useState(1); // 1 = 원본, 100 = 최대 화소 확대
            
            // 학생 폼 상태
            const [classNum, setClassNum] = useState('');
            const [studentNum, setStudentNum] = useState('');
            const [name, setName] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            const canvasRef = useRef(null);

            // HEX 코드 계산
            const getHex = () => {
                const toHex = (c) => {
                    const hex = c.toString(16).toUpperCase();
                    return hex.length === 1 ? "0" + hex : hex;
                };
                return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
            };

            // 캔버스에 디스플레이 화소 그리기
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;

                // 초기화
                ctx.clearRect(0, 0, width, height);

                // Zoom 배율에 따른 화면 분할 처리
                // zoom 1 ~ 10: 단색에서 화소 형태로 서서히 전환 (알파 페이드)
                // zoom 10 ~ 100: 화소가 점점 커짐
                
                const showPixelThreshold = 10;
                let solidAlpha = 1;
                let pixelAlpha = 0;

                if (zoom <= showPixelThreshold) {
                    solidAlpha = 1 - ((zoom - 1) / (showPixelThreshold - 1));
                    pixelAlpha = 1 - solidAlpha;
                } else {
                    solidAlpha = 0;
                    pixelAlpha = 1;
                }

                // 1. 일반 단색 렌더링 (멀리서 볼 때)
                if (solidAlpha > 0) {
                    ctx.globalAlpha = solidAlpha;
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.fillRect(0, 0, width, height);
                }

                // 2. RGB 서브픽셀 렌더링 (확대했을 때)
                if (pixelAlpha > 0) {
                    ctx.globalAlpha = pixelAlpha;
                    ctx.fillStyle = '#000000'; // 화소 사이의 검은 배경 (블랙매트릭스)
                    ctx.fillRect(0, 0, width, height);

                    // 셀 크기 계산 (최소 10px ~ 최대 100px)
                    const baseCellSize = 10;
                    const maxCellSize = 150;
                    const zoomFactor = Math.max(0, zoom - showPixelThreshold) / (100 - showPixelThreshold);
                    const cellSize = baseCellSize + (maxCellSize - baseCellSize) * Math.pow(zoomFactor, 1.5);

                    const padding = cellSize * 0.05;
                    const subWidth = (cellSize - (padding * 4)) / 3;
                    const subHeight = cellSize - (padding * 2);

                    // 성능을 위해 화면에 보이는 영역만 그리기
                    for (let y = 0; y < height; y += cellSize) {
                        for (let x = 0; x < width; x += cellSize) {
                            // R 화소
                            ctx.fillStyle = `rgb(${r}, 0, 0)`;
                            ctx.fillRect(x + padding, y + padding, subWidth, subHeight);
                            // G 화소
                            ctx.fillStyle = `rgb(0, ${g}, 0)`;
                            ctx.fillRect(x + padding * 2 + subWidth, y + padding, subWidth, subHeight);
                            // B 화소
                            ctx.fillStyle = `rgb(0, 0, ${b})`;
                            ctx.fillRect(x + padding * 3 + subWidth * 2, y + padding, subWidth, subHeight);
                        }
                    }
                }
                
                // 알파값 복구
                ctx.globalAlpha = 1.0;
            }, [r, g, b, zoom]);

            // 빠른 색상 설정
            const setPreset = (pr, pg, pb) => {
                setR(pr); setG(pg); setB(pb);
                setZoom(1); // 색상 변경시 한눈에 보이게 축소
            };

            const handleSubmit = async () => {
                if (!classNum || !studentNum || !name) {
                    alert("반, 번호, 이름을 모두 입력해주세요!");
                    return;
                }
                if (!GOOGLE_SCRIPT_URL) {
                    alert(`[제출 테스트]\n학번: ${classNum}반 ${studentNum}번\n이름: ${name}\n만든 색: ${getHex()}`);
                    return;
                }

                setIsSubmitting(true);
                const payload = {
                    classNum,
                    studentNum,
                    name,
                    hex: getHex()
                };

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    alert("성공적으로 전송되었습니다! 화면을 확인하세요.");
                    // 제출 후 폼 초기화 (색상은 유지)
                    setClassNum('');
                    setStudentNum('');
                    setName('');
                } catch (err) {
                    alert("전송 실패: 인터넷 연결을 확인하세요.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 text-white p-4 md:p-8">
                    <header className="max-w-5xl mx-auto mb-6 text-center">
                        <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                            모니터 화소(Pixel) 색상 맞추기
                        </h1>
                        <p className="text-slate-400 mt-2">선생님이 제시한 화면 색을 RGB 빛을 조절해 똑같이 만드세요!</p>
                    </header>

                    <div className="max-w-5xl mx-auto flex flex-col md:flex-row gap-6">
                        
                        {/* 왼쪽: 모니터 시뮬레이션 */}
                        <div className="flex-1 flex flex-col items-center">
                            <div className="glass-panel p-4 rounded-3xl w-full max-w-[400px]">
                                {/* 스마트폰/모니터 외형 느낌 */}
                                <div className="border-4 border-slate-800 rounded-2xl bg-black p-2 shadow-2xl relative overflow-hidden">
                                    <div className="absolute top-0 left-1/2 -translate-x-1/2 w-20 h-4 bg-slate-800 rounded-b-xl z-10"></div>
                                    <canvas 
                                        ref={canvasRef} 
                                        width={400} 
                                        height={600} 
                                        className="w-full h-auto aspect-[2/3] rounded-lg bg-black"
                                    ></canvas>
                                </div>
                            </div>
                        </div>

                        {/* 오른쪽: 컨트롤 패널 */}
                        <div className="flex-1 flex flex-col gap-4">
                            
                            {/* 확대(Zoom) 컨트롤 */}
                            <div className="glass-panel p-5 rounded-2xl border border-slate-700">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="font-bold text-slate-200">🔍 디스플레이 확대 현미경</span>
                                    <span className="text-sm font-mono bg-slate-800 px-2 py-1 rounded text-cyan-400">{zoom}x</span>
                                </div>
                                <input 
                                    type="range" min="1" max="100" value={zoom} 
                                    onChange={(e) => setZoom(Number(e.target.value))}
                                    className="range-zoom mt-2"
                                />
                                <p className="text-xs text-slate-400 mt-2">슬라이더를 당겨 화면을 이루는 RGB 화소를 관찰하세요.</p>
                            </div>

                            {/* RGB 슬라이더 */}
                            <div className="glass-panel p-5 rounded-2xl border border-slate-700">
                                <h2 className="font-bold mb-4 text-lg">빛의 세기 조절</h2>
                                <div className="space-y-6">
                                    <div>
                                        <div className="flex justify-between font-mono text-red-400 mb-1">
                                            <span>Red</span><span>{r}</span>
                                        </div>
                                        <input type="range" className="range-r" min="0" max="255" value={r} onChange={(e) => setR(Number(e.target.value))} />
                                    </div>
                                    <div>
                                        <div className="flex justify-between font-mono text-green-400 mb-1">
                                            <span>Green</span><span>{g}</span>
                                        </div>
                                        <input type="range" className="range-g" min="0" max="255" value={g} onChange={(e) => setG(Number(e.target.value))} />
                                    </div>
                                    <div>
                                        <div className="flex justify-between font-mono text-blue-400 mb-1">
                                            <span>Blue</span><span>{b}</span>
                                        </div>
                                        <input type="range" className="range-b" min="0" max="255" value={b} onChange={(e) => setB(Number(e.target.value))} />
                                    </div>
                                </div>
                                
                                {/* 빠른 실험 칩 */}
                                <div className="mt-6 flex flex-wrap gap-2">
                                    <button onClick={() => setPreset(255,255,0)} className="px-3 py-1 bg-slate-800 text-yellow-400 rounded-lg text-sm border border-yellow-400/30">노랑 (R+G)</button>
                                    <button onClick={() => setPreset(0,255,255)} className="px-3 py-1 bg-slate-800 text-cyan-400 rounded-lg text-sm border border-cyan-400/30">청록 (G+B)</button>
                                    <button onClick={() => setPreset(255,0,255)} className="px-3 py-1 bg-slate-800 text-pink-400 rounded-lg text-sm border border-pink-400/30">자홍 (R+B)</button>
                                    <button onClick={() => setPreset(255,255,255)} className="px-3 py-1 bg-slate-800 text-white rounded-lg text-sm border border-white/30">흰색 (R+G+B)</button>
                                    <button onClick={() => setPreset(0,0,0)} className="px-3 py-1 bg-slate-800 text-slate-400 rounded-lg text-sm border border-slate-600">끄기</button>
                                </div>
                            </div>

                            {/* 제출 폼 */}
                            <div className="glass-panel p-5 rounded-2xl border border-slate-700 flex-1 flex flex-col justify-between">
                                <div>
                                    <h2 className="font-bold mb-4 text-lg">결과 제출</h2>
                                    <div className="flex gap-2 mb-3">
                                        <input type="number" placeholder="반" value={classNum} onChange={(e)=>setClassNum(e.target.value)} className="w-20 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500" />
                                        <input type="number" placeholder="번호" value={studentNum} onChange={(e)=>setStudentNum(e.target.value)} className="w-20 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500" />
                                        <input type="text" placeholder="이름" value={name} onChange={(e)=>setName(e.target.value)} className="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500" />
                                    </div>
                                    <div className="flex items-center gap-3 bg-slate-800/50 p-3 rounded-lg border border-slate-700 mb-4">
                                        <div className="w-8 h-8 rounded-full shadow-inner border border-slate-600" style={{ backgroundColor: getHex() }}></div>
                                        <span className="font-mono text-slate-300">{getHex()}</span>
                                        <span className="text-xs text-slate-400 ml-auto">이 색상으로 제출됩니다.</span>
                                    </div>
                                </div>

                                <button 
                                    onClick={handleSubmit}
                                    disabled={isSubmitting}
                                    className={`btn-press w-full py-4 font-bold rounded-xl shadow-lg text-lg flex justify-center items-center ${isSubmitting ? 'bg-slate-600 text-slate-400' : 'bg-gradient-to-r from-blue-500 to-cyan-500 text-white'}`}
                                >
                                    {isSubmitting ? '전송 중...' : '📨 제출하기'}
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
